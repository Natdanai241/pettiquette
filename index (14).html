    '<div class="dots">' + TUT.map((_, i) => '<i class="' + (i === UI.tut ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="row center">' +
      '<button class="btn ghost sm" data-act="tutPrev" ' + (UI.tut === 0 ? 'disabled' : '') + '>← ก่อนหน้า</button>' +
      (UI.tut < TUT.length - 1
        ? '<button class="btn pri sm" data-act="tutNext">ถัดไป →</button>'
        : '<button class="btn mint sm" data-act="closeModal">พร้อมร่วมขบวน! 🎉</button>') +
    '</div>'
  );
}

/* ================= USER ACTIONS ================= */
function doLock() {
  if (!V || V.phase !== 'choose') return;
  const card = selectedCard();
  if (card == null) { toast('เลือกดาวเด่นและหมายเลขให้ครบก่อนนะ'); return; }
  if (V.lineup.includes(card)) { toast('ตั๋วใบนี้อยู่บนเวทีแล้ว เลือกใบอื่นนะ'); return; }
  sfx('lock');
  if (H) {
    const err = hostChoose(ME.pid, card);
    if (err) toast('⚠️ ' + err);
  } else {
    UI.pendingLock = card;
    UI.pendingKey = V.gid + '-' + V.round;
    if (NET.conn && NET.conn.open) {
      try { NET.conn.send({ t: 'choose', card }); } catch (e) {}
    } else toast('สัญญาณกำลังเชื่อมต่อ — ระบบจะส่งตั๋วให้อัตโนมัติ', 3000);
    render();
  }
}

function leaveToHome() {
  closeModal();
  $('#err').classList.remove('on');
  if (H && H.online) LS.del('wzoo_host');
  clearBotTimers();
  destroyNet();
  H = null; V = null; ME.pid = null;
  UI.roundKey = null; UI.revealKey = null; UI.endKey = null; UI.on.status = '';
  show('home');
  renderHome();
}

const ACT = {
  goSolo() { renderSolo(); show('solo'); },
  goOnline() { UI.on.status = ''; showOnline(); },
  help() { UI.tut = 0; renderTut(); },
  tutNext() { UI.tut = Math.min(TUT.length - 1, UI.tut + 1); renderTut(); },
  tutPrev() { UI.tut = Math.max(0, UI.tut - 1); renderTut(); },
  closeModal,
  music() {
    AU.music = !AU.music;
    LS.set('wzoo_music', AU.music);
    if (AU.music) { auInit(); bgmStart(); } else bgmStop();
    updateAudioBtns();
  },
  sfx() {
    AU.sfx = !AU.sfx;
    LS.set('wzoo_sfx', AU.sfx);
    updateAudioBtns();
  },
  home() { leaveToHome(); },
  set(d) {
    let v = d.v;
    if (d.k === 'timer') { v = +v; if (![30, 45, 60, 90].includes(v)) return; }
    else if (d.k === 'mode') { if (v !== 'comp' && v !== 'coop') return; }
    else return;
    if (d.scope === 'solo') { UI.solo[d.k] = v; renderSolo(); }
    else if (d.scope === 'online') { UI.on[d.k] = v; showOnline(); }
    else if (d.scope === 'lobby' && H && H.phase === 'lobby') { H[d.k] = v; hostChanged(); }
  },
  soloN(d) {
    UI.solo.n = Math.max(2, Math.min(6, UI.solo.n + (+d.v)));
    renderSolo();
  },
  soloStart() {
    const name = cleanName(ME.name) || 'ควาญน้อย';
    ME.name = name;
    LS.set('wzoo_name', name);
    destroyNet();
    clearBotTimers();
    V = null;
    H = newHost(false, UI.solo.mode, UI.solo.timer, null);
    hostAddPlayer(name, false, 'h');
    ME.pid = 'h';
    for (let i = 1; i < UI.solo.n; i++) hostAddBot();
    hostStart();
  },
  create() {
    const name = cleanName(ME.name);
    if (!name) { setOnStatus('กรุณากรอกชื่อผู้เข้าชมก่อน', 'err'); return; }
    ME.name = name;
    LS.set('wzoo_name', name);
    clearBotTimers();
    destroyNet();
    V = null;
    const code = genCode();
    H = newHost(true, UI.on.mode, UI.on.timer, code);
    hostAddPlayer(name, false, 'h');
    ME.pid = 'h';
    startHostPeer(code, false);
  },
  join() {
    const name = cleanName(ME.name);
    const code = (UI.on.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!name) { setOnStatus('กรุณากรอกชื่อผู้เข้าชมก่อน', 'err'); return; }
    if (code.length !== 5) { setOnStatus('รหัสตั๋วห้องต้องมี 5 ตัวอักษร', 'err'); return; }
    ME.name = name;
    LS.set('wzoo_name', name);
    clearBotTimers();
    destroyNet();
    H = null; V = null; ME.pid = null;
    joinRoom(name, code, false);
  },
  rejoinLast() {
    const last = LS.get('wzoo_last', null);
    if (!last) return;
    ME.name = last.name;
    UI.on.code = last.code;
    UI.on.status = '';
    showOnline();
    ACT.join();
  },
  restoreHost() {
    const sv = LS.get('wzoo_host', null);
    if (!sv || !sv.H) { toast('ไม่พบข้อมูลห้องเดิม'); renderHome(); return; }
    destroyNet();
    H = sv.H;
    H.botT = [];
    H.players.forEach(p => { if (!p.bot && p.id !== 'h') p.connected = false; });
    ME.pid = 'h';
    ME.name = sv.me || ME.name;
    V = null;
    UI.on.status = '';
    showOnline();
    startHostPeer(H.code, true);
  },
  copyLink() {
    const c = (V && V.code) || NET.code;
    if (c) copyText(shareLink(c), 'คัดลอกลิงก์เชิญเข้าสวนสัตว์แล้ว 🔗');
  },
  copyCode() {
    const c = (V && V.code) || NET.code;
    if (c) copyText(c, 'คัดลอกรหัสตั๋วห้องแล้ว 📋');
  },
  shareLink() {
    const c = V && V.code;
    if (!c) return;
    const url = shareLink(c);
    if (navigator.share) {
      navigator.share({
        title: 'วันเดอร์ซู พาเหรดลับ · WonderZoo Parade',
        text: 'มาร่วมจัดขบวนพาเหรดสัตว์มหัศจรรย์ใน วันเดอร์ซู พาเหรดลับ! รหัสตั๋ว: ' + c,
        url
      }).catch(() => {});
    } else copyText(url, 'คัดลอกลิงก์เชิญเข้าสวนสัตว์แล้ว 🔗');
  },
  addBot() {
    if (H && H.phase === 'lobby' && H.players.length < RULES.MAX_P) {
      hostAddBot();
      hostChanged();
    }
  },
  removeBot(d) {
    if (H && H.phase === 'lobby') {
      H.players = H.players.filter(p => !(p.bot && p.id === d.v));
      hostChanged();
    }
  },
  startGame() { if (H && H.phase === 'lobby') hostStart(); },
  pickP(d) {
    if (!V || V.phase !== 'choose') return;
    const p = +d.v;
    if (!(p >= 0 && p < 9)) return;
    UI.sel.p = p;
    if (UI.sel.n != null && V.lineup.includes(selectedCard())) UI.sel.n = null;
    sfx('pick');
    renderGame();
  },
  pickN(d) {
    if (!V || V.phase !== 'choose') return;
    const n = +d.v;
    if (!(n >= 1 && n <= 5)) return;
    UI.sel.n = n;
    if (UI.sel.p != null && V.lineup.includes(selectedCard())) {
      UI.sel.n = null;
      toast('ตั๋วใบนี้อยู่บนเวทีแล้ว');
    }
    sfx('pick');
    renderGame();
  },
  lock() { doLock(); },
  next() { hostNext(); },
  again() { hostAgain(); },
  restartSolo() { closeModal(); if (H && !H.online) hostStart(); },
  menu() {
    const online = V && V.online;
    openModal(
      '<h2>🎪 เมนูสวนสัตว์ WonderZoo</h2>' +
      (online
        ? '<div class="ticket-code-box"><div class="small">รหัสตั๋วห้อง</div><div class="bigcode" style="font-size:32px">' + esc(V.code) + '</div>' +
          '<div class="row center" style="margin-top:6px"><button class="btn sm ghost" data-act="copyCode">📋 คัดลอกรหัส</button><button class="btn sm ghost" data-act="copyLink">🔗 คัดลอกลิงก์</button></div></div>'
        : '') +
      '<button class="btn yel" data-act="help">📜 กติกาขบวนพาเหรด</button>' +
      '<div class="row center"><button class="btn ghost sm" data-act="music"><span class="musicLbl"></span></button><button class="btn ghost sm" data-act="sfx"><span class="sfxLbl"></span></button></div>' +
      (H && !H.online ? '<button class="btn blu" data-act="restartSolo">🔄 เริ่มขบวนใหม่</button>' : '') +
      '<button class="btn pri" data-act="leaveAsk">🚪 ออกจากเวทีพาเหรด</button>' +
      '<button class="btn ghost" data-act="closeModal">กลับไปเล่นต่อ</button>'
    );
  },
  leaveAsk() {
    if (!V) { leaveToHome(); return; }
    const msg = H && H.online
      ? 'คุณเป็นโฮสต์ของโดมพาเหรด หากออก ห้องจะปิดสำหรับผู้เล่นทุกคน'
      : (H ? 'ความคืบหน้าของขบวนพาเหรดรอบนี้จะสิ้นสุดลง' : 'คุณสามารถกลับเข้าห้องเดิมได้ภายหลังด้วยชื่อและรหัสตั๋วเดิม');
    openModal(
      '<h2>ออกจากขบวนพาเหรด?</h2><p>' + msg + '</p>' +
      '<div class="row center"><button class="btn ghost" data-act="closeModal">อยู่ต่อ</button><button class="btn pri" data-act="leave">ออกจากห้อง</button></div>'
    );
  },
  leave() { leaveToHome(); },
  errClose() {
    $('#err').classList.remove('on');
    if (!V && ['game', 'lobby', 'end'].includes(UI.screen)) leaveToHome();
  },
  errRetry() {
    $('#err').classList.remove('on');
    if (!NET.code) { leaveToHome(); return; }
    NET.noRetry = false; NET.leaving = false; NET.retry = 1;
    joinRoom(ME.name, NET.code, true);
  },
  errHome() { leaveToHome(); }
};

/* ================= EVENT LISTENERS ================= */
document.addEventListener('click', safe(e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  auInit();
  const act = b.dataset.act, fn = ACT[act];
  if (!fn) return;
  if (!['pickP', 'pickN', 'lock', 'music', 'sfx'].includes(act)) sfx('click');
  fn(b.dataset, b);
}));

document.addEventListener('pointerdown', () => auInit(), { passive: true });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'soloName' || t.id === 'onName') ME.name = t.value;
  else if (t.id === 'onCode') {
    const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (t.value !== v) t.value = v;
    UI.on.code = v;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'onCode') safe(ACT.join)();
  else if (t.id === 'soloName') safe(ACT.soloStart)();
});

/* ================= TIMER LOOP ================= */
setInterval(safe(() => {
  if (UI.screen !== 'game' || !V) return;
  const el = $('#timer');
  if (V.phase !== 'choose') {
    el.classList.add('idle');
    el.classList.remove('warn');
    $('#timerTxt').textContent = '–';
    $('#timerArc').style.strokeDashoffset = 0;
    return;
  }
  el.classList.remove('idle');
  const total = V.timer * 1000 + 1500;
  const rem = Math.max(0, UI.deadlineLocal - Date.now());
  const s = Math.ceil(rem / 1000);
  $('#timerTxt').textContent = s;
  $('#timerArc').style.strokeDashoffset = Math.min(100, Math.max(0, 100 - 100 * rem / total));
  const rk = V.gid + '-' + V.round;
  const locked = V.mine != null || (UI.pendingLock != null && UI.pendingKey === rk);
  el.classList.toggle('warn', s <= 5 && !locked);
  if (s <= 5 && s > 0 && s !== UI.lastTick && !locked) {
    UI.lastTick = s;
    sfx('tick');
  }
  if (rem <= 0 && !locked && !UI.autoLocked) {
    UI.autoLocked = true;
    if (selectedCard() != null) doLock();
    else toast('⏰ หมดเวลา! รอบนี้คุณส่งตั๋วพาเหรดไม่ทัน', 3000);
  }
}), 200);

/* ================= INIT ================= */
safe(() => {
  renderHome();
  updateAudioBtns();
  const q = new URLSearchParams(location.search).get('room');
  if (q) {
    const c = q.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (c) {
      UI.on.code = c;
      showOnline();
      toast('กรอกชื่อผู้เข้าชมแล้วกด “เข้าสู่ห้องพาเหรด” ได้เลย', 3000);
    }
  }
  if (!peerAvailable()) {
    setTimeout(() => { if (!peerAvailable()) console.warn('PeerJS unavailable'); }, 3000);
  }
})();
</script>
</body>
</html>
